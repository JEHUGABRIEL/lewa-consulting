name: check-lib-fields

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: check-lib-fields-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fields:
    name: Champs des données lib/*.ts consommés
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Le script n'utilise que des modules Node natifs (aucune dépendance) :
      # pas besoin de npm ci, le check s'exécute directement.
      - name: Vérifier que les champs des données lib/*.ts sont consommés
        run: node scripts/check-lib-fields.mjs
